<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#007bff">
    <link rel="apple-touch-icon" href="icons/icon-180.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="Expenses">

  <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.1/css/all.min.css">
  <link rel="stylesheet" href="style.css">
  <script src="biometric.js"></script>
    <script src="script.js"></script>
    <script src="mobile-nav.js"></script>
  <title>Dashboard - Expense Manager</title>
</head>

<body onload="check_perm()" data-active-tab="home" data-fab-modal="addExpenseModalContent" data-fab-label="Add expense">

  <header class="topbar">
    <h1>Expense Manager</h1>
  </header>

  <div class="container mt-3">
    <h2>Welcome to Your Dashboard</h2>
    <h3 id="message">Your Transactions</h2>

      <ul class="pagination">
        <li><button class="prev" disabled id="prev-btn"><i class="fas fa-chevron-left"></i><span class="btn-label">Previous</span></button></li>
        <li><button class="prev" id="filter-btn"
            onclick="openModal(modalContentId='filterExpenseModalContent')"><i class="fas fa-filter"></i><span class="btn-label">Filter</span></button></li>
        <li><button class="next" id="Export_btn" onclick="export_data()"><i class="fas fa-file-export"></i><span class="btn-label">Export</span></button></li>
        <li><button class="next" disabled id="clear-filter-btn"><i class="fas fa-times"></i><span class="btn-label">Clear filter</span></button></li>
        <li><button class="next" disabled id="next-btn"><i class="fas fa-chevron-right"></i><span class="btn-label">Next</span></button></li>
      </ul>

      <table id="transactionTable">
        <thead>
          <tr>
            <th>Date</th>
            <th>Source</th>
            <th>Transaction Type</th>
            <th>Amount</th>
            <th>Commodity</th>
            <th>Comments</th>
            <th>Edit</th>
            <th>Delete</th>
          </tr>
        </thead>
        <tbody>
          <!-- Table rows will be added dynamically using JavaScript -->
        </tbody>
      </table>
  </div>



  <div class="modal" tabindex="-1" id="Modal">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title">Data</h5>
          <button type="button" onclick="closeModal()" class="close" data-dismiss="modal" aria-label="Close">
            <span aria-hidden="true">&times;</span>
          </button>
        </div>
        <div class="modal-body">
          <div id="modal-message"></div>
          <div id="addExpenseModalContent"></div>
          <div id="editExpenseModalContent"></div>
          <div id="deleteExpenseModalContent"></div>
          <div id="filterExpenseModalContent"></div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-dismiss="modal" onclick="closeModal()">Close</button>
          <button type="button" class="btn btn-primary" id="modal-save-btn">Save changes</button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.10.2/dist/umd/popper.min.js"></script>
  <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>

  <script>

    async function check_perm() {
      if (!check_user_logged_in()) {
        window.location.href = 'index.html';
      }
      else {
        check_user_logged_in();
        await fetch_sources();
        await fetch_commodities();
        await fetch_expense_data();
        if (typeof enableFab === 'function') enableFab();
      }
    }



  </script>
</body>

</html>
