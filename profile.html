<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#007bff">
    <link rel="apple-touch-icon" href="icons/icon-180.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="Expenses">

    <link
      rel="stylesheet"
      href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.1/css/all.min.css"
    />
    <link rel="stylesheet" href="style.css" />
    <script src="https://cdn.jsdelivr.net/npm/@simplewebauthn/browser@14.0.0/dist/bundle/index.umd.min.js" defer></script>
    <script src="biometric.js" defer></script>
    <script src="script.js" defer></script>
    <script src="mobile-nav.js" defer></script>
    <title>Profile - Expense Manager</title>
  </head>

  <body onload="check_perm()" data-active-tab="more">
    <header class="topbar">
      <h1>Profile</h1>
    </header>

    <div class="container mt-3">
      <h2>Welcome to Your Profile</h2>
      <h3>Your Information</h3>

      <p id="message"></p>
      <form id="updateProfile">
        <div class="form-group">
          <label for="username">Username</label>
          <input
            type="text"
            class="form-control"
            id="username"
            placeholder="Enter username"
            required
            readonly
          />
        </div>

        <div class="form-group">
          <label for="email">Email</label>
          <input
            type="email"
            class="form-control"
            id="email"
            placeholder="Enter email"
            required
          />
        </div>

        <div class="form-group">
          <label for="firstName">First Name</label>
          <input
            type="text"
            class="form-control"
            id="firstName"
            placeholder="Enter first name"
            required
          />
        </div>

        <div class="form-group">
          <label for="lastName">Last Name</label>
          <input
            type="text"
            class="form-control"
            id="lastName"
            placeholder="Enter last name"
            required
          />
        </div>

        <div class="form-group">
          <label for="gender">Gender</label>
          <select class="form-control" id="gender" required>
            <option value="Male">Male</option>
            <option value="Female">Female</option>
          </select>
        </div>

        <div class="form-group">
          <div class="form-check">
            <input 
              type="checkbox" 
              class="form-check-input" 
              id="sendMonthlyReport" 
            />
            <label class="form-check-label" for="sendMonthlyReport">Send Monthly Report</label>
          </div>
        </div>

        <button type="button" class="btn btn-primary" onclick="updateProfile()">
          Update
        </button>
      </form>

      <form id="changePasswordForm">
        <h3 class="mt-5">Change Password</h3>
        <div class="form-group">
          <label for="password1">Current Password</label>
          <input
            type="password"
            class="form-control"
            id="password1"
            placeholder="Enter Current password"
            required
          />
        </div>

        <div class="form-group">
          <label for="password2">New Password</label>
          <input
            type="password"
            class="form-control"
            id="password2"
            placeholder="Enter New password"
            required
          />
        </div>

        <button
          type="button"
          class="btn btn-primary"
          onclick="updatePassword()"
        >
          Change Password
        </button>
      </form>

      <h3 class="mt-5">Security</h3>
      <div class="form-group">
        <p id="biometricStatus">Fingerprint / Face ID quick-unlock is off on this device.</p>
        <button type="button" class="btn btn-secondary" id="biometricToggleBtn" onclick="toggleBiometric()">
          Enable fingerprint / Face ID unlock
        </button>
      </div>

      <h3 class="mt-5">Danger Zone</h3>
      <form id="DeleteAccount">
        <div class="form-group">
          <p style="color: red">This action can not be reversed</p>
          <p>
            Please write <i>delete</i> in the given box to delete your account
          </p>
          <label for="password1">Delete Account</label>
          <input
            type="text"
            class="form-control"
            id="deleteAccount"
            placeholder="delete"
            required
          />
        </div>

        <button
          type="button"
          class="btn btn-danger"
          onclick="deleteAccountFunc()"
        >
          Delete Account
        </button>
      </form>
    </div>

    <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.10.2/dist/umd/popper.min.js"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>

    <script>
      async function check_perm() {
        if (!check_user_logged_in()) {
          window.location.href = "index.html";
        } else {
          check_user_logged_in();
          //console.log(localStorage.getItem("userID"));
          await fetch_profile();
          refreshBiometricUI();
        }
      }

      function refreshBiometricUI() {
        const statusEl = document.getElementById("biometricStatus");
        const btn = document.getElementById("biometricToggleBtn");
        if (isBiometricEnabled()) {
          statusEl.textContent = "Fingerprint / Face ID quick-unlock is on for this device.";
          btn.textContent = "Disable fingerprint / Face ID unlock";
        } else {
          statusEl.textContent = "Fingerprint / Face ID quick-unlock is off on this device.";
          btn.textContent = "Enable fingerprint / Face ID unlock";
        }
      }

      async function toggleBiometric() {
        if (isBiometricEnabled()) {
          disableBiometric();
          refreshBiometricUI();
          return;
        }
        if (!(await isBiometricSupported())) {
          document.getElementById("message").style.color = "red";
          document.getElementById("message").textContent =
            "This device/browser doesn't support fingerprint or Face ID unlock.";
          setTimeout(function () {
            document.getElementById("message").textContent = "";
          }, 3000);
          return;
        }
        try {
          await registerBiometric(userID, document.getElementById("username").value);
          sessionStorage.setItem('appUnlocked', '1');
          refreshBiometricUI();
        } catch (err) {
          document.getElementById("message").style.color = "red";
          document.getElementById("message").textContent =
            "Could not enable fingerprint/Face ID unlock: " + err.message;
          setTimeout(function () {
            document.getElementById("message").textContent = "";
          }, 3000);
        }
      }

      function deleteAccountFunc() {
        const msg = document.getElementById("deleteAccount").value;

        if (msg == "delete") {
          fetch(
            `${get_api_url()}/api/accounts/profile/${userID}`,
            {
              method: "DELETE",
              headers: {
                "Content-Type": "application/json",
                Authorization: `Token ${userToken}`,
              },
            }
          )
            .then((response) => {
              if (response.status == 204) {
                document.getElementById("message").textContent =
                  "Account Deleted Successfully !";
                setTimeout(function () {
                  document.getElementById("message").textContent = "";
                  logout();
                }, 3000);
              } else {
                document.getElementById("message").textContent = "Error";
                setTimeout(function () {
                  document.getElementById("message").textContent = "Error";
                }, 3000);
              }
            })
            .catch((error) => {
              document.getElementById("message").style.color = "red";
              document.getElementById("message").textContent =
                "An error occurred during posting data. " + `${error}`;
              setTimeout(function () {
                document.getElementById("message").textContent = "";
              }, 1500);
            });
        }
      }
    </script>
  </body>
</html>
