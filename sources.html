<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#007bff">
    <link rel="apple-touch-icon" href="icons/icon-180.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="Expenses">
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.1/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    <script src="biometric.js"></script>
    <script src="script.js"></script>
    <script src="mobile-nav.js"></script>
    <title>Sources</title>
</head>

<body onload="check_perm()" data-active-tab="more" data-fab-modal="addSourceModalContent" data-fab-label="Add source">
    <header class="topbar">
        <h1>Sources</h1>
    </header>

    <div class="container mt-3">
        <h2>Welcome to Your Sources</h2>
        <h3 id="message">Your Sources</h2>

            <div style="overflow-x:auto;">
            <table id="SourcesTable">
                <thead>
                    <tr>
                        <th>Source</th>
                        <th>Edit</th>
                        <th>Delete</th>
                    </tr>
                </thead>
                <tbody>
                    <!-- Table rows will be added dynamically using JavaScript -->
                </tbody>
            </table>
            </div>
    </div>

    <div class="modal" tabindex="-1" id="Modal">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Data</h5>
                    <button type="button" onclick="closeModal()" class="close" data-dismiss="modal" aria-label="Close">
                        <span aria-hidden="true">&times;</span>
                    </button>
                </div>
                <div class="modal-body">
                    <div id="modal-message"></div>
                    <div id="addSourceModalContent"></div>
                    <div id="editSourceModalContent"></div>
                    <div id="deleteSourceModalContent"></div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-dismiss="modal"
                        onclick="closeModal()">Close</button>
                    <button type="button" class="btn btn-primary" id="modal-save-btn">Save changes</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.10.2/dist/umd/popper.min.js"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>

    <script>
        async function check_perm() {
            if (!check_user_logged_in()) {
                window.location.href = 'index.html';
            }
            else {
                check_user_logged_in();
                await load_sources();
                if (typeof enableFab === 'function') enableFab();
            }
        }


    </script>
</body>

</html>
